notes = 'The 0.6 spec states this in the transformation field table ("Required: yes"), not with a keyword. In 0.4 and 0.5, yaozarrs infers a missing `type` from the parameter field that is present (lenient); in 0.6 the transformation union discriminates on `type`, so a missing one is rejected (tagged as YZ-SC-002 inside a scene, untagged elsewhere).'

