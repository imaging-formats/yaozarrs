# Registry of rule codes: one entry per normative statement in the NGFF spec
# (`YZ-<AREA>-NNN`), plus checks yaozarrs adds beyond the spec (`YZ-NNN`).
#
# Codes are permanent: never renumber or reuse one. Line numbers are maintained by
# `uv run python scripts/ngff_rules.py check --fix`; never edit them by hand.
# See `.claude/skills/ngff-rules/SKILL.md` for how to add, change, or retire rules.

# Spec source files, pinned to immutable commits. Keys are the tracked versions.
# Each pin is the commit that ngff.openmicroscopy.org publishes: the `ome/ngff` repo
# (built by Read the Docs) includes each version as a submodule of `ome/ngff-spec`,
# rendered from its `index.md`. `scripts/ngff_rules.py site` checks the pins are current.

[spec."0.4"]
ref = '0.4'  # a branch: ngff-spec has no 0.4.x release tags
repo = 'ome/ngff-spec'
sha = 'a4c68004fdb8a8d822367205dc12f9574a32ddf8'
path = 'index.md'

[spec."0.5"]
ref = '0.5'  # a branch: ngff-spec has no 0.5.x release tags
repo = 'ome/ngff-spec'
sha = 'd9164040dd61b3e4688494de1a58a69251b13f24'
path = 'index.md'

[spec."0.6"]
ref = '0.6'
repo = 'ome/ngff-spec'
sha = '89da1da5b0491f83b7cdde7d123aef763a457029'
path = 'index.md'

# ------------------------------------------------------------------------------
# YZ-AX
# ------------------------------------------------------------------------------

[rules.YZ-AX-001]
slug = 'axis-name-unique'
level = 'MUST'
summary = 'Axis names must be unique within `axes`.'
introduced = '0.4'

[[rules.YZ-AX-001.sources]]
quote = 'The values MUST be unique across all "name" fields.'
lines = { "0.4" = [251, 251], "0.5" = [181, 181] }

[[rules.YZ-AX-001.sources]]
quote = 'The values in the `name` fields MUST be unique within the same coordinate system.'
lines = { "0.6" = [260, 260] }

[rules.YZ-AX-002]
slug = 'axes-space-count'
level = 'MUST'
summary = '`axes` must contain 2 or 3 axes of type `space`.'
introduced = '0.4'
notes = 'For 0.6, yaozarrs only warns about a coordinate system with no `space` axes but at least two `array` axes: the prose forbids it, but the JSON schema allows it.'

[[rules.YZ-AX-002.sources]]
quote = 'The "axes" MUST contain 2 or 3 entries of "type:space"'
lines = { "0.4" = [367, 367], "0.5" = [301, 301] }

[[rules.YZ-AX-002.sources]]
quote = '`axes` MUST contain 2 or 3 entries of `type:space`'
lines = { "0.6" = [1289, 1289] }

[rules.YZ-AX-003]
slug = 'axes-time-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `time`.'
introduced = '0.4'

[[rules.YZ-AX-003.sources]]
quote = 'MAY contain one additional entry of "type:time"'
lines = { "0.4" = [367, 367], "0.5" = [301, 301] }

[[rules.YZ-AX-003.sources]]
quote = 'MAY contain one additional entry of `type:time`'
lines = { "0.6" = [1290, 1290] }

[rules.YZ-AX-004]
slug = 'axes-channel-at-most-one'
level = 'MAY'
summary = '`axes` may contain at most one axis of type `channel` (or of a null/custom type).'
introduced = '0.4'
notes = 'yaozarrs currently only counts axes of type `channel`; multiple null/custom axes are not rejected.'

[[rules.YZ-AX-004.sources]]
quote = 'MAY contain one additional entry of "type:channel" or a null / custom type'
lines = { "0.4" = [367, 367], "0.5" = [301, 301] }

[[rules.YZ-AX-004.sources]]
quote = 'MAY contain one additional entry of `type:channel` or a null / custom type'
lines = { "0.6" = [1291, 1291] }

[rules.YZ-AX-005]
slug = 'axes-type-order'
level = 'MUST'
summary = 'Axes must be ordered by type: `time` (if present), then `channel` or custom (if present), then `space`.'
introduced = '0.4'

[[rules.YZ-AX-005.sources]]
quote = 'the entries MUST be ordered by "type" where the "time" axis must come first (if present), followed by the "channel" or custom axis (if present) and the axes of type "space".'
lines = { "0.4" = [368, 368], "0.5" = [302, 302] }

[[rules.YZ-AX-005.sources]]
quote = '`axes` entries MUST be ordered by `type` where the `time` axis must come first (if present), followed by the `channel` or custom axis (if present) and the axes of type `space`.'
lines = { "0.6" = [1292, 1293] }

[rules.YZ-AX-006]
slug = 'axis-unit-recognized'
level = 'SHOULD'
summary = 'An axis `unit` should be one of the UDUNITS-2 units in the spec.'
introduced = '0.4'
notes = 'yaozarrs checks this for `space` and `time` axes.'

[[rules.YZ-AX-006.sources]]
quote = 'The value SHOULD be one of the following strings, which are valid units according to UDUNITS-2.'
lines = { "0.4" = [253, 253], "0.5" = [183, 183], "0.6" = [252, 253] }

[rules.YZ-AX-007]
slug = 'dimension-names-present'
level = 'MUST'
summary = "Each multiscale array's `zarr.json` must include `dimension_names`."
introduced = '0.5'
removed = '0.6'
severity = 'warning'
notes = 'yaozarrs only warns, because zarr-python omits `dimension_names` unless it is passed explicitly.'

[[rules.YZ-AX-007.sources]]
quote = 'The "dimension_names" attribute MUST be included in the `zarr.json` of the Zarr array of a multiscale level'
lines = { "0.5" = [189, 189] }

[rules.YZ-AX-008]
slug = 'dimension-names-match-axes'
level = 'MUST'
summary = "An array's `dimension_names` must match the names in `axes`."
introduced = '0.5'
removed = '0.6'
notes = 'For 0.4 stores, yaozarrs checks a non-standard `dimension_names` array attribute if it is present.'

[[rules.YZ-AX-008.sources]]
quote = 'and MUST match the names in the "axes" metadata.'
lines = { "0.5" = [189, 189] }

[rules.YZ-AX-009]
slug = 'axis-name-present'
level = 'MUST'
summary = 'Each axis must have a `name`.'
introduced = '0.4'

[[rules.YZ-AX-009.sources]]
quote = 'MUST contain the field "name" that gives the name for this dimension.'
lines = { "0.4" = [251, 251], "0.5" = [181, 181] }

[[rules.YZ-AX-009.sources]]
quote = 'MUST contain the field `name` that gives the name for this dimension.'
lines = { "0.6" = [243, 243] }

[rules.YZ-AX-010]
slug = 'axis-name-nonempty-string'
level = 'MUST'
summary = 'An axis `name` must be a non-empty string.'
introduced = '0.6'

[[rules.YZ-AX-010.sources]]
quote = 'The value MUST be a non-empty string.'
lines = { "0.6" = [244, 244] }

[rules.YZ-AX-011]
slug = 'axis-long-name-string'
level = 'MUST'
summary = 'An axis `longName`, if present, must be a string.'
introduced = '0.6'

[[rules.YZ-AX-011.sources]]
quote = 'MAY contain the field `longName`. The value MUST be a string'
lines = { "0.6" = [256, 257] }

[rules.YZ-AX-012]
slug = 'axis-discrete-boolean'
level = 'MUST'
summary = 'An axis `discrete`, if present, must be a boolean.'
introduced = '0.6'

[[rules.YZ-AX-012.sources]]
quote = 'MAY contain the field `discrete`. The value MUST be a boolean'
lines = { "0.6" = [248, 249] }

[rules.YZ-AX-013]
slug = 'multiscale-axes-min-count'
level = 'MUST'
summary = 'A coordinate system inside `multiscales` must have at least 2 axes.'
introduced = '0.6'
notes = 'The 0.6 spec writes this in lowercase, as the start of a sentence that continues with MUST. The upper limit is YZ-DS-003.'

[[rules.YZ-AX-013.sources]]
quote = 'The length of `axes` must be between 2 and 5'
implied = true
lines = { "0.6" = [1288, 1288] }

[rules.YZ-AX-014]
slug = 'axis-type-present'
level = 'SHOULD'
summary = 'Each axis should have a `type`.'
introduced = '0.4'
notes = 'yaozarrs does not warn about a missing `type` (such an axis is read as a custom axis).'

[[rules.YZ-AX-014.sources]]
quote = 'SHOULD contain the field "type".'
lines = { "0.4" = [252, 252], "0.5" = [182, 182] }

[[rules.YZ-AX-014.sources]]
quote = 'SHOULD contain the field `type`.'
lines = { "0.6" = [245, 245] }

[rules.YZ-AX-015]
slug = 'axis-type-known'
level = 'SHOULD'
summary = 'An axis `type` should be one of the types defined in the spec; other values are allowed for custom types.'
introduced = '0.4'
notes = '0.4 and 0.5 list `space`, `time` and `channel`; 0.6 adds `array`, `coordinate` and `displacement` (types it introduces). yaozarrs does not warn about custom types.'

[[rules.YZ-AX-015.sources]]
quote = 'It SHOULD be one of "space", "time" or "channel", but MAY take other string values for custom axis types that are not part of this specification yet.'
lines = { "0.5" = [182, 182], "0.4" = [252, 252]}

[[rules.YZ-AX-015.sources]]
quote = 'It SHOULD be one of the strings `array`, `space`, `time`, `channel`, `coordinate`, or `displacement` but MAY take other string values for custom axis types that are not part of this specification yet.'
lines = { "0.6" = [246, 247] }

[rules.YZ-AX-016]
slug = 'axis-unit-present'
level = 'SHOULD'
summary = 'Each axis should have a `unit`.'
introduced = '0.4'
notes = 'The spec states this for every axis, not only `space` and `time` ones. yaozarrs does not warn about a missing `unit`; which values are recognized is YZ-AX-006.'

[[rules.YZ-AX-016.sources]]
quote = 'SHOULD contain the field "unit" to specify the physical unit of this dimension.'
lines = { "0.4" = [253, 253], "0.5" = [183, 183] }

[[rules.YZ-AX-016.sources]]
quote = 'SHOULD contain the field `unit` to specify the physical unit of this dimension.'
lines = { "0.6" = [251, 251] }

[rules.YZ-AX-017]
slug = 'axes-spatial-zyx-order'
level = 'SHOULD'
summary = 'Three spatial axes, two in the image plane and one stacking axis, should be ordered `zyx`.'
introduced = '0.4'
notes = 'Which axis is the anisotropic stacking axis is not stated in the metadata, so yaozarrs does not check this.'

[[rules.YZ-AX-017.sources]]
quote = 'If there are three spatial axes where two correspond to the image plane ("yx") and images are stacked along the other (anisotropic) axis ("z"), the spatial axes SHOULD be ordered as "zyx".'
lines = { "0.4" = [369, 369], "0.5" = [303, 303] }

[[rules.YZ-AX-017.sources]]
quote = 'If there are three spatial axes where two correspond to the image plane (`yx`) and images are stacked along the other (anisotropic) axis (`z`), the spatial axes SHOULD be ordered as `zyx`.'
lines = { "0.6" = [1294, 1296] }

