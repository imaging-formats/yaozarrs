[rules.YZ-GN-002]
slug = 'json-no-comments'
level = 'MUST'
summary = 'JSON metadata must not contain comments.'
introduced = '0.4'
notes = '''The sentence explains the comments in the spec's own examples, but the requirement applies to real documents. Comments aren't valid JSON, so a JSON parser already rejects them.'''

[[rules.YZ-GN-002.sources]]
quote = 'However, these are only for clarity purposes and comments MUST NOT be included in JSON objects.'
lines = { "0.4" = [118, 119], "0.5" = [43, 44], "0.6" = [43, 43] }

[rules.YZ-GN-003]
slug = 'ome-key-present'
level = 'MUST'
summary = 'The group `attributes` must contain the key `ome`.'
introduced = '0.5'
notes = 'The 0.5 spec only says that the metadata is stored under the `ome` key in `attributes`, without a keyword. 0.4 has no `ome` namespace (see [YZ-ZR-003](YZ-ZR-003.md)).'

[[rules.YZ-GN-003.sources]]
quote = 'The group `attributes` MUST contain a key `ome`.'
lines = { "0.6" = [180, 180] }

[[rules.YZ-GN-003.sources]]
quote = 'In this file, the metadata is stored under the namespaced key `ome` in `attributes`.'
implied = true
lines = { "0.5" = [159, 160] }

[rules.YZ-GN-004]
slug = 'ome-value-object'
level = 'MUST'
summary = 'The value of the `ome` key must be a JSON object.'
introduced = '0.6'

[[rules.YZ-GN-004.sources]]
quote = 'The value of the `ome` key MUST be a JSON object'
lines = { "0.6" = [180, 181] }

[rules.YZ-GN-005]
slug = 'ome-version-consistent'
level = 'MUST'
summary = 'The OME-Zarr metadata version must be the same throughout a hierarchy.'
introduced = '0.5'
notes = '''There is no rule code for this yet. The storage validator parses child groups with the models of the root's version, so a child that declares another version fails as invalid metadata under the parent's rule (e.g. [YZ-PL-007](YZ-PL-007.md)).'''

[[rules.YZ-GN-005.sources]]
quote = 'The OME-Zarr Metadata version MUST be consistent within a hierarchy.'
lines = { "0.5" = [163, 163], "0.6" = [178, 178] }

[rules.YZ-GN-006]
slug = 'ome-version-string'
level = 'MUST'
summary = 'The `version` of the `ome` object must be a string.'
introduced = '0.5'
notes = 'The 0.5 spec says the version "is denoted as a string", without a keyword.'

[[rules.YZ-GN-006.sources]]
quote = 'The version of the OME-Zarr Metadata is denoted as a string in the `version` attribute within the `ome` namespace.'
implied = true
lines = { "0.5" = [161, 161] }

[[rules.YZ-GN-006.sources]]
quote = 'the value of which MUST be a string specifying the version of the OME-Zarr specification'
lines = { "0.6" = [181, 181] }

