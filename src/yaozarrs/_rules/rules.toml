severity = 'warning'
notes = 'The JSON schema requires this of every `scale`, but the prose only says values SHOULD be non-zero (YZ-CT-022) and allows negative ones. The spec editor confirmed that only positive values are meant for dataset scales (ome/ngff#637), so yaozarrs warns, and only for those.'

