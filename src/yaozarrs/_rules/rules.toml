# ------------------------------------------------------------------------------
# YZ
# ------------------------------------------------------------------------------

[rules.YZ-001]
slug = 'zarr-node-name-invalid'
summary = 'A path used as a Zarr node name violates the Zarr v3 node-name rules.'
severity = 'error'
notes = 'See the [Zarr v3 node names](https://zarr-specs.readthedocs.io/en/latest/v3/core/index.html#node-names) rules.'

[rules.YZ-002]
slug = 'zarr-node-name-risky'
summary = 'A path used as a Zarr node name contains characters outside `[A-Za-z0-9._-]`, which can cause problems on some filesystems or in URLs.'
severity = 'warning'
notes = 'Set `YAOZARRS_ALLOW_RISKY_NODE_NAMES=1` to silence this warning.'

[rules.YZ-003]
slug = 'label-multiscales-count-matches-image'
summary = 'A label image must have the same number of `multiscales` as its image.'
severity = 'error'
notes = "The spec doesn't state this directly, but it is needed to pair each label multiscale with an image multiscale for YZ-IL-002."

[rules.YZ-004]
slug = 'version-prerelease'
summary = 'The document declares a pre-release of a spec version.'
severity = 'warning'
notes = "The 0.6 schema accepts the release candidate `0.6rc0`. `0.6.dev4` isn't in the schema, but much of the 0.6 data written so far uses it."

[rules.YZ-005]
slug = 'version-unsupported'
summary = 'The document or store declares an OME-Zarr version that yaozarrs does not know.'
severity = 'error'

[rules.YZ-006]
slug = 'transform-path-relative'
summary = "The `path` of a transformation's parameters must be a relative path with no empty, `.` or `..` segments."
severity = 'error'
notes = 'The 0.6 spec only says "a location in this container". Like ngff-zarr, yaozarrs rejects paths whose meaning nothing defines.'

