notes = 'The spec says RECOMMENDED, which RFC 2119 defines as SHOULD.'

[[rules.YZ-SC-009.sources]]
quote = '''If they do so, it is RECOMMENDED that the scene's first entry under the `coordinateSystems` field is used as the default, if present.'''
lines = { "0.6" = [1853, 1853] }

[rules.YZ-SC-010]
slug = 'scene-reference-coordinate-system-first'
level = 'SHOULD'
summary = '''A coordinate system that is a common reference for the others in a `scene` should be the scene's first `coordinateSystems` entry.'''
introduced = '0.6'
notes = 'The spec says RECOMMENDED, which RFC 2119 defines as SHOULD. Stated in a hint. Checking it would need to decide which coordinate system is the common reference.'

[[rules.YZ-SC-010.sources]]
quote = 'it is RECOMMENDED that this coordinate system be stored as the first coordinateSystems entry in the scene.'
lines = { "0.6" = [1854, 1854] }

