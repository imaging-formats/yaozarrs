[rules.YZ-GN-001]
slug = 'ome-version-present'
level = 'MUST'
summary = 'The `ome` object must contain a `version` key.'
introduced = '0.5'
notes = 'The 0.5 spec only says that the version is denoted by this attribute, without a keyword.'

[[rules.YZ-GN-001.sources]]
quote = 'object that MUST contain a `version` key,'
lines = { "0.6" = [181, 181] }

[[rules.YZ-GN-001.sources]]
quote = 'The version of the OME-Zarr Metadata is denoted as a string in the `version` attribute within the `ome` namespace.'
implied = true
