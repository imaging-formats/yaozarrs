name: Documentation
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.13"

      # TODO: re-enable --strict once https://github.com/zensical/zensical/issues/700
      # (and the related autorefs over-flagging) is fixed.
      - run: uv run --group docs zensical build --clean
      - run: touch site/.nojekyll
      # for docs-preview.yml, which deploys PR builds (it can't see the PR number)
      - if: github.event_name == 'pull_request'
        run: echo "${{ github.event.number }}" > pr-number
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: |
            site
            pr-number
          include-hidden-files: true

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: site
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: site
          clean-exclude: pr-preview/
